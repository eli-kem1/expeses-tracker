<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense TTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1> Expenses Tracker</h1>

        <div class="form-section">
            <input type="text" id="expenseName" placeholder="Enter expense Name" />
            <input type="number" id="expenseAmount" placeholder="Enter amount" />
            <select id="expenseCategory">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transportation">Transportation</option>
                <option value="Bills">Utilities/Bills</option>
                <option value="Shopping">Shopping</option>
            </select>
            <input type="date" id="expenseDate" />
            <button id="addExpenseBtn">Add Expenses</button>
        </div>
        
        

        <div class="list-section">
            <h3>Expenses List</h3>

            <div class="list-header">
                <span>Item/Comodity</span>
                <span>Category</span>
                <span>Date</span>
                <span>Amount</span>
                <span>Action</span>
            </div>
            <ul id="expenseList"></ul>
        </div>

        <div class="summary">
            <h2>Total Amount: GHS <span id="totalAmount">0</span></h2>
        </div>
    </div>

    <script src="javascript/script.js"></script>


    
</body>
</html>
